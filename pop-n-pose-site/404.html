<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Pop N Pose Photobooth</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..700,0..100,0..1;1,9..144,500..700,0..100,0..1&family=Work+Sans:wght@500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(50% 50% at 50% 45%,rgba(201,160,66,.28),transparent 70%),#0E0D0B;color:#FFFDF8;font-family:"Work Sans",system-ui,sans-serif;text-align:center}
.card{max-width:560px}
.strip{display:inline-block;background:#FFFDF8;padding:10px 10px 30px;border-radius:6px;transform:rotate(-6deg);box-shadow:0 20px 40px -14px #000;margin-bottom:34px;position:relative}
.strip div{width:120px;height:80px;border-radius:3px;margin-bottom:8px;background:#1A1814;display:grid;place-items:center;font-family:"Fraunces",serif;font-size:2rem;color:#E2C477}
.strip div:last-of-type{margin-bottom:0}
.strip p{position:absolute;bottom:9px;left:0;right:0;font:700 .55rem/1 "Work Sans";letter-spacing:.2em;text-transform:uppercase;color:#7A5C17}
h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(2.4rem,8vw,3.8rem);line-height:1.05;letter-spacing:-.02em}
h1 em{font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1;background:linear-gradient(135deg,#B8892E,#F3DC8E 40%,#C9A042 70%,#E6C873);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.05em}
p.sub{color:#CFC7B6;margin:16px auto 30px;max-width:26rem;line-height:1.6}
a{display:inline-block;background:linear-gradient(135deg,#8C6A1E,#E6C873 38%,#B8892E 62%,#F3DC8E);color:#0E0D0B;font-weight:600;text-decoration:none;padding:1rem 1.6rem;border-radius:999px}
a:focus-visible{outline:3px solid #E2C477;outline-offset:3px}
.hand{font-family:"Caveat",cursive;font-size:1.5rem;color:#E2C477;margin-top:22px}
</style>
</head>
<body>
  <main class="card">
    <div class="strip" aria-hidden="true"><div>4</div><div>0</div><div>4</div><p>Pop N Pose</p></div>
    <h1>This pose <em>didn't print.</em></h1>
    <p class="sub">The page you're looking for isn't here. Let's get you back to the booth.</p>
    <a href="/">Back to the booth →</a>
    <p class="hand">say cheese anyway ✦</p>
  </main>
</body>
</html>
